version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: securepay_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: securepay_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d securepay_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: securepay_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/securepay_db?schema=public
      JWT_SECRET: production_super_secret_jwt_key_securepay_2026
      JWT_EXPIRES_IN: 24h
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 100
    ports:
      - "5000:5000"

volumes:
  postgres_data:
